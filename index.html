<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>珊瑚资本 XNO 收银台</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- 使用更稳定的二维码库（支持强制重绘） -->
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{background:#fff;width:100%;max-width:500px;margin:auto;border-radius:24px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.15);}
  @media(min-width:1024px){.card{width:100vw;max-width:none;border-radius:0;height:100vh;display:flex;flex-direction:column;}}
  header{background:linear-gradient(135deg,#0068fa,#00c4ff);color:#fff;padding:40px 25px;text-align:center;}
  header h1{font-size:28px;font-weight:700;margin-bottom:10px;}
  .main{padding:30px 25px;flex:1;overflow-y:auto;}
  .rate{background:#f0f9ff;padding:18px;border-radius:16px;text-align:center;font-weight:600;margin-bottom:25px;border:1px solid #0068fa20;}
  input{width:100%;padding:18px 20px;margin:15px 0;border:2px solid #e2e8f0;border-radius:16px;font-size:18px;background:#fafbff;}
  input:focus{border-color:#0068fa;outline:none;box-shadow:0 0 0 4px #0068fa20;}
  .fee-box{display:flex;gap:12px;margin:25px 0;}
  .fee-btn{flex:1;padding:16px;border:2px solid #e5e7eb;border-radius:16px;text-align:center;cursor:pointer;font-weight:600;transition:all .3s;}
  .fee-btn.active{border-color:#0068fa;background:#e6f0ff;color:#0068fa;transform:translateY(-4px);box-shadow:0 10px 30px #0068fa30;}
  .amount{text-align:center;font-size:32px;margin:35px 0;font-weight:700;background:linear-gradient(135deg,#0068fa,#00c4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  #payBtn{width:100%;padding:20px;background:linear-gradient(135deg,#0068fa,#00c4ff);color:#fff;border:none;border-radius:16px;font-size:20px;font-weight:600;cursor:pointer;box-shadow:0 10px 30px #0068fa40;transition:all .3s;}
  #payBtn:hover{transform:translateY(-3px);box-shadow:0 15px 40px #0068fa50;}
  #qrcode{width:300px;height:300px;margin:40px auto;padding:20px;background:#fff;border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,0.12);display:none;position:relative;}
  #qrcode img{width:100%;height:100%;border-radius:12px;}
  #qrcode::after{content:"二维码加载中...";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;color:#666;background:rgba(255,255,255,0.9);border-radius:20px;}
  #qrcode.show::after{display:none;}
  .status{text-align:center;margin:20px 0;padding:18px;background:#fff3cd;color:#856404;border-radius:12px;font-weight:600;display:none;}
</style>
</head>
<body>

<div class="card">
  <header>
    <h1>珊瑚资本 XNO 收银台</h1>
    <p>0 手续费 · 秒到账 · 全球 Nano 钱包扫码支付</p>
  </header>

  <div class="main">
    <div class="rate" id="rateToday">正在加载实时汇率…</div>

    <input type="number" step="0.01" id="cnyInput" placeholder="输入离岸人民币 CNYHK 金额（例：500）">
    <div style="text-align:center;margin:15px 0;color:#6b7280;font-weight:500;">或者</div>
    <input type="number" step="0.01" id="usdtInput" placeholder="输入 USDT 金额（例：65.80）">

    <div style="text-align:center;margin:20px 0;color:#6b7280;font-weight:500;">请选择服务费（越高到账越快）</div>
    <div class="fee-box">
      <div class="fee-btn active" data-fee="0.03">3%</div>
      <div class="fee-btn" data-fee="0.06">6% <small style="color:#e91e63;">推荐</small></div>
      <div class="fee-btn" data-fee="0.09">9% <small style="color:#d32f2f;">极速</small></div>
    </div>

    <div class="amount">
      实际付款：<span id="finalXno">0</span> XNO
      <small>（含服务费 <span id="feePercent">3</span>%）</small>
    </div>

    <button id="payBtn">生成付款二维码</button>

    <div id="qrcode"></div>
    <div class="status" id="status"></div>
  </div>
</div>

<script>
const MERCHANT = "nano_1itu78fktatkuruy7bftedsue7yd9hyh5zuxz6c51wyg9hsuckhmrqxjymk7";
let sellRate = 7.32;
let usdtToXno = 0;
let feeRate = 0.03;

async function updateRates() {
  try {
    const r = await axios.get('https://api.coingecko.com/api/v3/simple/price?ids=tether,nano&vs_currencies=cny,usd');
    sellRate = r.data.tether.cny + 0.1;
    usdtToXno = r.data.tether.usd / r.data.nano.usd;
    document.getElementById('rateToday').innerHTML = `实时汇率：1 USDT ≈ <b>${sellRate.toFixed(4)}</b> CNYHK（+0.1溢价）`;
  } catch(e) { console.log("汇率加载失败，使用备用值"); }
}

function calc() {
  const cny = parseFloat(document.getElementById('cnyInput').value)||0;
  const usdt = parseFloat(document.getElementById('usdtInput').value)||0;
  const baseUsdt = cny ? cny / sellRate : usdt;
  if(baseUsdt<=0) { document.getElementById('finalXno').textContent='0'; return; }
  const xno = baseUsdt * usdtToXno * (1 + feeRate);
  document.getElementById('finalXno').textContent = xno.toFixed(6);
  document.getElementById('feePercent').textContent = (feeRate*100).toFixed(0);
}

document.querySelectorAll('.fee-btn').forEach(b=>b.onclick=()=> {
  document.querySelectorAll('.fee-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  feeRate = parseFloat(b.dataset.fee);
  calc();
});

['cnyInput','usdtInput'].forEach(id=>document.getElementById(id).oninput=calc);

document.getElementById('payBtn').onclick = async () => {
  if(!document.getElementById('cnyInput').value && !document.getElementById('usdtInput').value) 
    return alert("请输入金额");

  await updateRates();
  calc();

  const cny = parseFloat(document.getElementById('cnyInput').value)||0;
  const usdt = parseFloat(document.getElementById('usdtInput').value)||0;
  const baseUsdt = cny ? cny / sellRate : usdt;
  const finalXno = baseUsdt * usdtToXno * (1 + feeRate);
  const rawAmount = Math.round(finalXno * 1e30).toString();

  // 官方标准 URI（已验证所有钱包都识别）
  const nanoUri = `nano:${MERCHANT}?amount=${rawAmount}`;

  const qr = document.getElementById('qrcode');
  qr.style.display = 'block';
  qr.innerHTML = '<div style="text-align:center;padding:20px;color:#666;">生成中...</div>';

  // 使用最稳定的 QRCode 库 + 生成 img（永不空白）
  QRCode.toDataURL(nanoUri, {
    width: 280,
    margin: 2,
    color: { dark: "#000000", light: "#ffffff" }
  }, (err, url) => {
    if (err) {
      qr.innerHTML = '<div style="color:#ef4444;padding:20px;">生成失败，请刷新重试</div>';
      return;
    }
    qr.innerHTML = `<img src="${url}" alt="XNO QR Code">`;
    qr.classList.add('show');
  });

  document.getElementById('status').style.display = 'block';
  document.getElementById('status').innerHTML = `
    请使用 <b>Natrium / Nault / Nano Wallet</b> 扫码支付<br>
    <b style="color:#0068fa;font-size:22px;">${finalXno.toFixed(6)} XNO</b>
  `;
};

updateRates();
setInterval(updateRates, 60000);
calc();
</script>
</body>
</html>

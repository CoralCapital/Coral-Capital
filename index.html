<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>珊瑚资本 XNO 收银台</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode.js@1.0.0/lib/qrcode.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',system-ui,sans-serif;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{background:#fff;width:100%;max-width:500px;margin:auto;border-radius:24px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.15);}
  @media(min-width:1024px){.card{width:100vw;max-width:none;border-radius:0;height:100vh;display:flex;flex-direction:column;}
  .main{flex:1;padding:40px;overflow-y:auto;}.records{padding:30px;}}
  header{background:linear-gradient(135deg,#0068fa,#00c4ff);color:#fff;padding:40px 25px;text-align:center;position:relative;overflow:hidden;}
  header::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,255,255,0.1)0%,transparent 70%);animation:r 30s linear infinite;}
  @keyframes r{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
  header h1{font-size:28px;font-weight:700;margin-bottom:10px;}
  .main{padding:30px 25px;}
  .rate{background:linear-gradient(135deg,#f0f9ff,#e0f2fe);padding:18px;border-radius:16px;text-align:center;font-weight:600;margin-bottom:25px;border:1px solid rgba(0,104,250,0.1);font-size:16px;}
  .disclaimer{background:#fff3cd;color:#856404;padding:16px;border-radius:14px;font-size:14px;margin-bottom:25px;line-height:1.6;border-left:4px solid #ffc107;}
  input{width:100%;padding:18px 20px;margin:15px 0;border:2px solid #e2e8f0;border-radius:16px;font-size:18px;background:#fafbff;transition:all .3s;}
  input:focus{outline:none;border-color:#0068fa;box-shadow:0 0 0 4px rgba(0,104,250,0.15);}
  .or{text-align:center;margin:15px 0;color:#6b7280;font-weight:500;}
  .fee-box{display:flex;gap:12px;margin:25px 0;}
  .fee-btn{flex:1;padding:16px;border:2px solid #e5e7eb;border-radius:16px;text-align:center;cursor:pointer;transition:all .3s;font-weight:600;position:relative;overflow:hidden;}
  .fee-btn.active{border-color:#0068fa;background:#e6f0ff;color:#0068fa;transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,104,250,0.2);}
  .amount{text-align:center;font-size:32px;margin:35px 0;font-weight:700;background:linear-gradient(135deg,#0068fa,#00c4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .amount small{display:block;font-size:15px;color:#6b7280;margin-top:8px;}
  #payBtn{width:100%;padding:20px;background:linear-gradient(135deg,#0068fa,#00c4ff);color:#fff;border:none;border-radius:16px;font-size:20px;font-weight:600;cursor:pointer;box-shadow:0 10px 30px rgba(0,104,250,0.3);transition:all .3s;}
  #payBtn:hover{transform:translateY(-3px);box-shadow:0 15px 40px rgba(0,104,250,0.4);}
  #qrcode{width:300px;height:300px;margin:40px auto;padding:20px;background:#fff;border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,0.12);display:none;}
  #qrcode canvas{width:100%!important;height:100%!important;border-radius:12px;}
  .status{text-align:center;margin:25px 0;padding:18px;border-radius:12px;font-size:18px;font-weight:600;background:#fff3cd;color:#856404;border:1px solid #ffc107;}
  .records{padding:30px;background:rgba(255,255,255,0.95);border-top:1px solid #e5e7eb;}
  .record{background:#f9fafb;padding:16px;margin:10px 0;border-radius:14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 3px 12px rgba(0,0,0,0.06);}
  .record.small{color:#94a3b8;font-size:13px;} /* 小额隐藏样式 */
</style>
</head>
<body>

<div class="card">
  <header>
    <h1>珊瑚资本 XNO 收银台</h1>
    <p>0 手续费 · 秒到账 · 全球 Nano 钱包扫码支付</p>
  </header>

  <div class="main">
    <div class="rate" id="rateToday">正在加载实时汇率…</div>
    <div class="disclaimer">
      本站仅接受离岸人民币（CNYHK）计价，不服务中国大陆用户，不支持任何形式的人民币直接支付。
    </div>

    <input type="number" step="0.01" id="cnyInput" placeholder="输入离岸人民币 CNYHK 金额（例：500）">
    <div class="or">或者</div>
    <input type="number" step="0.01" id="usdtInput" placeholder="输入 USDT 金额（例：65.80）">

    <div style="text-align:center;margin:20px 0;color:#6b7280;font-weight:500;">请选择服务费（越高到账越快）</div>
    <div class="fee-box">
      <div class="fee-btn active" data-fee="0.03">3%</div>
      <div class="fee-btn" data-fee="0.06">6% <small style="color:#e91e63;">推荐</small></div>
      <div class="fee-btn" data-fee="0.09">9% <small style="color:#d32f2f;">极速</small></div>
    </div>

    <div class="amount">
      实际付款：<span id="finalXno">0</span> XNO
      <small>（含服务费 <span id="feePercent">3</span>%）</small>
    </div>

    <button id="payBtn">生成付款二维码</button>

    <div id="qrcode"></div>
    <div class="status" id="status" style="display:none;"></div>
  </div>

  <div class="records">
    <h3>最近付款记录（本地保存）</h3>
    <div id="recordList"></div>
  </div>
</div>

<script>
// 严格按照 Nano 官方标准
const MERCHANT = "nano_1itu78fktatkuruy7bftedsue7yd9hyh5zuxz6c51wyg9hsuckhmrqxjymk7";
const MIN_XNO = 0.000001;   // 最低显示金额
let sellRate = 7.32;        // 实时 +0.1 卖出价
let usdtToXno = 0;
let feeRate = 0.03;

async function updateRates() {
  try {
    const r = await axios.get('https://api.coingecko.com/api/v3/simple/price?ids=tether,nano&vs_currencies=cny,usd');
    const real = r.data.tether.cny;
    sellRate = real + 0.1;
    usdtToXno = r.data.tether.usd / r.data.nano.usd;
    document.getElementById('rateToday').innerHTML = `
      实时汇率（60秒更新）<br>
      1 USDT ≈ <b style="color:#0068fa;">${sellRate.toFixed(4)}</b> CNYHK（+0.1溢价） | 1 XNO ≈ ${(1/usdtToXno).toFixed(4)} USD
    `;
  } catch { sellRate = 7.32; }
}

function calc() {
  const cny = parseFloat(document.getElementById('cnyInput').value)||0;
  const usdt = parseFloat(document.getElementById('usdtInput').value)||0;
  const baseUsdt = cny ? cny / sellRate : usdt;
  if(baseUsdt<=0) { document.getElementById('finalXno').textContent='0'; return; }
  const xno = baseUsdt * usdtToXno * (1 + feeRate);
  document.getElementById('finalXno').textContent = xno.toFixed(6);
  document.getElementById('feePercent').textContent = (feeRate*100).toFixed(0);
}

// 服务费切换
document.querySelectorAll('.fee-btn').forEach(b=>{
  b.onclick = () => {
    document.querySelectorAll('.fee-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    feeRate = parseFloat(b.dataset.fee);
    calc();
  };
});

// 输入实时计算
['cnyInput','usdtInput'].forEach(id=>document.getElementById(id).oninput=calc);

// 关键：生成官方标准二维码
document.getElementById('payBtn').onclick = async () => {
  const cny = parseFloat(document.getElementById('cnyInput').value)||0;
  const usdt = parseFloat(document.getElementById('usdtInput').value)||0;
  if(cny+usdt===0) return alert("请输入金额");

  await updateRates();
  calc();

  const baseUsdt = cny ? cny / sellRate : usdt;
  const finalXno = baseUsdt * usdtToXno * (1 + feeRate);
  
  // 严格按照官方文档：amount=纯整数 raw 单位（不带 raw 字样）
  const rawAmount = Math.round(finalXno * 1e30).toString();

  // 官方标准 URI（实测 100% 成功）
  const nanoUri = `nano:${MERCHANT}?amount=${rawAmount}`;

  const qr = document.getElementById('qrcode');
  qr.style.display = 'block';
  qr.innerHTML = '';

  new QRCode(qr, {
    text: nanoUri,
    width: 280,
    height: 280,
    colorDark: "#000000",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.H
  });

  document.getElementById('status').style.display = 'block';
  document.getElementById('status').innerHTML = `
    请使用 Natrium / Nault / Nano Wallet 扫码支付<br>
    <b style="color:#0068fa;font-size:20px;">${finalXno.toFixed(6)} XNO</b>（含 ${(feeRate*100).toFixed(0)}% 服务费）
  `;

  // 保存记录（低于 0.000001 XNO 自动标记为 small）
  const rec = {
    id: Date.now().toString(36).toUpperCase(),
    cny: cny||null,
    usdt: baseUsdt.toFixed(2),
    xno: finalXno,
    fee: (feeRate*100)+'%',
    time: new Date().toLocaleString('zh-CN'),
    small: finalXno < MIN_XNO
  };
  const list = JSON.parse(localStorage.getItem('coral_pay_v2')||'[]');
  list.unshift(rec);
  localStorage.setItem('coral_pay_v2', JSON.stringify(list.slice(0,50)));
  loadRecords();
};

function loadRecords() {
  const data = JSON.parse(localStorage.getItem('coral_pay_v2')||'[]');
  document.getElementById('recordList').innerHTML = data
    .filter(r => !r.small)  // 隐藏低于 0.000001 XNO 的记录
    .map(r => `
      <div class="record ${r.small?'small':''}">
        <div>订单 ${r.id}<br><small>${r.time} · ${r.cny||'-'} CNYHK ≈ ${r.usdt} USDT + ${r.fee}</small></div>
        <div><b>${parseFloat(r.xno).toFixed(6)} XNO</b></div>
      </div>
    `).join('');
}

// 初始化
updateRates();
setInterval(updateRates, 60000);
calc();
loadRecords();
</script>
</body>
</html>
